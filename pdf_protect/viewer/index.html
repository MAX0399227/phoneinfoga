<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lector seguro — CVZ</title>
<style>
  :root { --bg:#1b1d22; --panel:#23262d; --accent:#3b6ef0; }
  * { box-sizing: border-box; }
  html, body {
    margin:0; height:100%; background:var(--bg); color:#e8e8e8;
    font-family: system-ui, Segoe UI, Roboto, sans-serif;
    /* Evita seleccion de texto en toda la interfaz */
    -webkit-user-select:none; -moz-user-select:none; user-select:none;
  }
  #gate {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg); z-index:50;
  }
  #gate .card {
    background:var(--panel); padding:28px 26px; border-radius:14px; width:330px;
    box-shadow:0 10px 40px rgba(0,0,0,.5); text-align:center;
  }
  #gate h1 { font-size:18px; margin:0 0 4px; }
  #gate p  { font-size:12px; color:#9aa0aa; margin:0 0 18px; }
  #gate input {
    width:100%; padding:11px 12px; border-radius:8px; border:1px solid #3a3f49;
    background:#15171b; color:#fff; font-size:15px; letter-spacing:1px; text-align:center;
  }
  #gate button {
    margin-top:14px; width:100%; padding:11px; border:0; border-radius:8px;
    background:var(--accent); color:#fff; font-size:15px; cursor:pointer;
  }
  #gate .err { color:#ff6b6b; font-size:12px; min-height:16px; margin-top:8px; }

  #toolbar {
    position:sticky; top:0; z-index:20; display:flex; gap:14px; align-items:center;
    padding:8px 14px; background:var(--panel); border-bottom:1px solid #30343c;
    font-size:13px;
  }
  #toolbar button { background:#2f333b; color:#e8e8e8; border:1px solid #3a3f49;
    border-radius:6px; padding:5px 10px; cursor:pointer; }
  #toolbar .spacer { flex:1; }
  #stage { padding:24px 0 60px; display:flex; flex-direction:column; align-items:center; gap:18px; }
  .page-wrap { position:relative; box-shadow:0 4px 18px rgba(0,0,0,.5); }
  canvas { display:block; max-width:100%; }

  /* Capa de marca de agua repetida sobre el canvas */
  .wm {
    position:absolute; inset:0; pointer-events:none; overflow:hidden;
    display:flex; flex-wrap:wrap; align-content:flex-start;
    transform:rotate(-30deg) scale(1.4); transform-origin:center;
    opacity:.16;
  }
  .wm span { color:#888; font-weight:700; font-size:26px; padding:34px 40px; white-space:nowrap; }

  /* Cortina de seguridad: oscurece todo al perder foco o intentar capturar */
  #blackout {
    position:fixed; inset:0; background:#000; color:#888; z-index:90;
    display:none; align-items:center; justify-content:center; font-size:15px; text-align:center;
  }
  #blackout.show { display:flex; }
</style>
</head>
<body>

  <!-- Pantalla de clave -->
  <div id="gate">
    <div class="card">
      <h1>Documento protegido</h1>
      <p>Lectura sin límite de tiempo · Marca de agua CVZ</p>
      <input id="pwd" type="password" placeholder="Clave del archivo" autofocus />
      <button id="open">Abrir</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <!-- Cortina anti-captura -->
  <div id="blackout">Contenido oculto para proteger el documento.<br>Vuelve a esta ventana para continuar leyendo.</div>

  <!-- Barra y contenido -->
  <div id="toolbar" style="display:none">
    <strong>CVZ</strong>
    <span style="color:#9aa0aa">Documento protegido — copia/captura deshabilitadas</span>
    <span class="spacer"></span>
    <button id="zoomOut">A−</button>
    <button id="zoomIn">A+</button>
  </div>
  <div id="stage"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
